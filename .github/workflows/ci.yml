name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install
        run: bun install --frozen-lockfile
      - name: Semantic contracts and consumer tests
        run: bun --no-env-file run test:semantic
      - name: Canonical evaluation contracts without inference
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: acme-test-key
        run: bun --no-env-file evals/technical.ts
      - name: SQL guarantees in disposable process memory
        run: bun --no-env-file run test:semantic:sql
      - name: Typecheck intelligence and API
        run: |
          bun --no-env-file x tsc --noEmit -p packages/intelligence/tsconfig.json
          bun --no-env-file x tsc --noEmit -p apps/api/tsconfig.json
          bun --no-env-file x tsc --noEmit -p evals/tsconfig.json

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck all workspaces
        run: bunx turbo run typecheck

      - name: Test client packages and dashboard
        run: bunx turbo run test --filter=@kairo/dashboard --filter=@kairo/client-core --filter=@kairo/tokens --filter=@kairo/ui

      - name: Lint dashboard
        run: bun run --cwd apps/dashboard lint
      - name: Lint landing
        run: bun run --cwd apps/landing lint
      - name: Lint kelan
        run: bun run --cwd apps/kelan lint

      - name: Package boundaries
        run: bun run ui:boundaries

      - name: UI scripts
        run: bun test scripts/ui

      - name: UI catalog is current
        run: bun run ui:catalog -- --check

      - name: UI metrics
        run: bun run ui:metrics

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build the desktop shell
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Test the desktop shell
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
